[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A second async runtime must never appear (Tokio is the only executor).
deny = [
    { crate = "async-std" },
    { crate = "smol" },
    { crate = "openssl-sys" }, # rustls only
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
