[package]
name = "shopee-hunter-analytics"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
shopee-hunter-domain.workspace = true
shopee-hunter-storage.workspace = true
# Needed to run read-only aggregate queries over the shared `Database` pool
# rather than adding methods to the storage crate. Already a workspace
# dependency (storage uses it), so nothing new enters the lockfile.
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
